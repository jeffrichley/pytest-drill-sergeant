# Pre-commit: the fast checks only (no mypy, no pytest on a commit).
# The gate is `just check`; these hooks are the part worth paying for on every commit.
# Install with `just install-hooks`.
fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key

  # The project's own ruff through uv, never a mirror with its own `rev:`. The version
  # comes from uv.lock alone, so these hooks cannot drift from what CI runs.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

  # Conventional Commits, on the commit-msg hook.
  - repo: local
    hooks:
      - id: commitizen
        name: commitizen check
        entry: uv run cz check --allow-abort --commit-msg-file
        language: system
        stages: [commit-msg]
