[project]
name = "pytest-drill-sergeant"
version = "0.4.0"
description = "A pytest plugin and CLI that catch the ways AI coding agents write bad tests"
readme = "README.md"
license = "MIT"
authors = [{ name = "Jeff Richley" }]
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0",
    "typer>=0.12",
]
keywords = ["pytest", "testing", "quality", "ai", "agents", "lint"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/jeffrichley/pytest-drill-sergeant"
Repository = "https://github.com/jeffrichley/pytest-drill-sergeant.git"
Issues = "https://github.com/jeffrichley/pytest-drill-sergeant/issues"

[project.scripts]
drill-sergeant = "pytest_drill_sergeant.cli:app"

# Installing the package turns the plugin on.
[project.entry-points.pytest11]
drill_sergeant = "pytest_drill_sergeant.plugin"

[dependency-groups]
dev = [
    "commitizen>=4.18.0",
    "mypy>=2.3.0",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-randomly>=3.16",
    "pytest-repeat>=0.9.3",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.6",
    "ruff>=0.16.3",
    "vulture>=2.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_drill_sergeant"]

# --- The gate -----------------------------------------------------------------------
# `just check` runs everything below, and CI runs `just check`. The rule set is the
# handbook's clean-start (clippers) standard: ruff with google docstrings, mypy strict,
# vulture, a branch-coverage floor; full on the code and relaxed on the tests.

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "B",    # flake8-bugbear
    "Q",    # flake8-quotes
    "SIM",  # flake8-simplify
    "C90",  # mccabe
    "ARG",  # flake8-unused-arguments
    "TID",  # flake8-tidy-imports
    "UP",   # pyupgrade
    "PL",   # pylint
    "PERF", # perflint
    "D",    # pydocstyle
    "ANN",  # flake8-annotations
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line length is the formatter's
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# The clock is injected, so reading it is banned in src/. The one place that wires it
# in carries a `# noqa: TID251` with its reason.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "Inject the clock."
"datetime.datetime.utcnow".msg = "Inject the clock."
"datetime.date.today".msg = "Inject the clock."
"time.time".msg = "Inject the clock."

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests are held to the short set: what is wrong (F, E, B), what is stale (UP, I), and
# no more. A test's name is its docstring.
"**/tests/**" = ["N", "Q", "SIM", "C90", "ARG", "TID", "PL", "PERF", "D", "ANN", "RUF"]
# The corpus is bad tests on purpose: analysed by the engine, never run.
"**/tests/corpus/**" = ["N", "Q", "SIM", "C90", "ARG", "TID", "PL", "PERF", "D", "ANN", "RUF", "B", "F631"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
files = ["src/pytest_drill_sergeant"]

[tool.vulture]
paths = ["src"]
min_confidence = 80

[tool.coverage.run]
source = ["src/pytest_drill_sergeant"]
branch = true
# The pytest11 entry point imports the plugin before pytest-cov starts measuring;
# measuring subprocesses from their start counts that code in the xdist workers.
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# The commit-message convention only; nothing here releases (release-please does).
[tool.commitizen]
name = "cz_conventional_commits"

[tool.pytest.ini_options]
testpaths = ["tests"]
# A hung test fails as itself after a minute, with its stack. No `timeout_method`:
# pytest-timeout uses a signal where the OS has one, so the test fails and the run goes
# on. Only Windows falls back to a thread, which ends the run (or, under xdist, kills
# the worker, and xdist reports whatever test it was running as failed).
timeout = 60
# Why each test failed, and a report of every run, so a flake leaves evidence.
addopts = ["-ra", "--junitxml=test-report.xml"]
# Our own suite runs with the plugin on and passes its own checks. The corpus is bad
# tests on purpose, so no check reports on it (`DS` is every family).
drill_sergeant_per_file_ignores = ["tests/corpus/**: DS"]
