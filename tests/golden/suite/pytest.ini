# The golden suite's own config: a short file limit, so one file runs past it (DS106);
# DS104 lowered to two act-then-assert cycles, so the checkout test's two show (warn);
# and DS101 turned up to fail, so the report shows a fail, a warn and a waived finding.
[pytest]
drill_sergeant_max_file_lines = 40
drill_sergeant_max_act_assert_cycles = 1
drill_sergeant_levels =
    DS101=fail
