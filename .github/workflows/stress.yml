name: stress

# The suite several times over, shuffled, to find flakes before a run does. A red night
# is a flaky test: file it as the handbook's running-projects.md says.
on:
  schedule:
    - cron: "37 7 * * *"
  workflow_dispatch:

concurrency:
  group: stress
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  stress:
    # The same runner and setup as ci.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.59.0"
      - run: uv sync --locked --group dev
      - run: just stress
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: stress-report
          path: stress-report.xml
          if-no-files-found: ignore
