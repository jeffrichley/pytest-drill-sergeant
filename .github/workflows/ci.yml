name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # A public repo runs on GitHub's runners, never a self-hosted one: a fork's pull
    # request could otherwise run a stranger's code on Jeff's machine.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        # Pinned so CI runs the same just as local, from nothing but the repo.
        with:
          just-version: "1.59.0"
      - run: uv sync --locked --group dev
      # The gate, by name: every step is the justfile's, none is this file's.
      - run: just check
      # A red run keeps its report, so a flake can be read, not guessed at.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-report
          path: test-report.xml
          if-no-files-found: ignore

  perf:
    # The speed budget, outside the gate: timings belong to the machine, so this job
    # fails alone and never hides a red gate. The same runner and setup as `check`.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.59.0"
      - run: uv sync --locked --group dev
      - run: just perf
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: perf-report
          path: test-report.xml
          if-no-files-found: ignore
